name: Supply Chain Audit

description: Install and run cargo-audit and cargo-deny.

runs:
  using: composite
  steps:
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-suffix: supply-chain

    - name: Cache cargo-audit
      id: cache-audit
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-audit
        key: cargo-audit-${{ runner.os }}

    - name: Install cargo-audit
      if: steps.cache-audit.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install cargo-audit --locked

    - name: Cache cargo-deny
      id: cache-deny
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-deny
        key: cargo-deny-${{ runner.os }}

    - name: Install cargo-deny
      if: steps.cache-deny.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install cargo-deny --locked

    - name: Run audit
      shell: bash
      run: make audit
