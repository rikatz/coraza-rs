[package]
name = "libinjection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = ["legacy"]
std = ["memchr/std"]
legacy = []
deep = ["dep:sqlparser", "alloc"]
alloc = []

[dependencies]
memchr = { version = "2", default-features = false }
sqlparser = { version = "0.62", optional = true, default-features = false, features = ["std"] }

[[test]]
name = "corpus_parse"
path = "tests/corpus_parse.rs"
required-features = ["legacy"]

[[test]]
name = "no_alloc"
path = "tests/no_alloc.rs"
required-features = ["legacy"]

[dev-dependencies]
